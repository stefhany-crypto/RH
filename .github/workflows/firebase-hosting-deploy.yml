name: Deploy Firebase (hosting + functions + regras)

# A cada push na main, publica o pacote completo no Firebase:
# site (public/), Cloud Functions, regras do Firestore e do Storage.
# Autenticacao via Workload Identity Federation (OIDC) — sem chaves nem
# tokens armazenados. Nao depende de login local do Firebase CLI.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/458881257037/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@pdimirae.iam.gserviceaccount.com

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependencias das Functions
        run: npm ci
        working-directory: functions

      - name: Publicar (hosting + functions + regras)
        run: firebase deploy --only hosting,functions,firestore:rules,storage --project pdimirae --non-interactive
