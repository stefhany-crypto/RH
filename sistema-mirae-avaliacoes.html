                        }

                    localStorage.setItem('mirae_users', JSON.stringify(demoUsers));
                }
                
                if (!localStorage.getItem('mirae_avaliacoes')) {
                    localStorage.setItem('mirae_avaliacoes', JSON.stringify({}));
                }
            },
            
            getUsers() {
                return JSON.parse(localStorage.getItem('mirae_users') || '[]');
            },
            
            getUser(email, senha) {
                const users = this.getUsers();
                return users.find(u => u.email === email && u.senha === senha);
            },
            
            getUserById(id) {
                const users = this.getUsers();
                return users.find(u => u.id === id);
            },
            
            getAvaliacoes() {
                return JSON.parse(localStorage.getItem('mirae_avaliacoes') || '{}');
            },
            
            saveAvaliacao(userId, trimestre, ano, data) {
                const avaliacoes = this.getAvaliacoes();
                const key = `${userId}_${ano}_${trimestre}`;
                avaliacoes[key] = {
                    userId,
                    trimestre,
                    ano,
                    data,
                    updatedAt: new Date().toISOString()
                };
                localStorage.setItem('mirae_avaliacoes', JSON.stringify(avaliacoes));
            },
            
            addUser(userData) {
                const users = this.getUsers();
                const newId = Math.max(...users.map(u => u.id), 0) + 1;
                const newUser = {
                    id: newId,
                    ...userData,
                    createdAt: new Date().toISOString()
                };
                users.push(newUser);
                localStorage.setItem('mirae_users', JSON.stringify(users));
                return newUser;
            },
            
            updateUser(id, userData) {
                const users = this.getUsers();
                const index = users.findIndex(u => u.id === id);
                if (index !== -1) {
                    users[index] = {
                        ...users[index],
                        ...userData,
                        updatedAt: new Date().toISOString()
                    };
                    localStorage.setItem('mirae_users', JSON.stringify(users));
                    return users[index];
                }
                return null;
            },
            
            deleteUser(id) {
                const users = this.getUsers();
                const filtered = users.filter(u => u.id !== id);
                localStorage.setItem('mirae_users', JSON.stringify(filtered));
                return true;
            }
        };
        
        // Inicializar banco
        DB.init();
        
        // ============================================
        // SISTEMA DE AUTENTICAÇÃO
        // ============================================
        
        const Auth = {
            currentUser: null,
            
            login(email, senha) {
                const user = DB.getUser(email, senha);
                if (user) {
                    this.currentUser = user;
                    sessionStorage.setItem('mirae_current_user', JSON.stringify(user));
                    return true;
                }
                return false;
            },
            
            logout() {
                this.currentUser = null;
                sessionStorage.removeItem('mirae_current_user');
                render();
            },
            
            checkAuth() {
                const stored = sessionStorage.getItem('mirae_current_user');
                if (stored) {
                    this.currentUser = JSON.parse(stored);
                    return true;
                }
                return false;
            },
            
            isAdmin() {
                return this.currentUser?.tipo === 'admin';
            },
            
            isGestor() {
                return this.currentUser?.tipo === 'gestor';
            }
        };
